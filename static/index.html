<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipForge</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d8cff'/%3E%3Cstop offset='1' stop-color='%234a9fe6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='9' y='3' width='14' height='26' rx='4' fill='url(%23g)'/%3E%3C/svg%3E">
  <script>try { const t = localStorage.getItem("cf-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/"><span class="logo" aria-hidden="true"></span><span>ClipForge</span></a>
    <nav class="nav" aria-label="Tools">
      <a href="#/clips" data-nav="clips">Clip maker</a>
      <a href="#/live" data-nav="live">Live clips</a>
      <a href="#/monitor" data-nav="monitor">Auto monitor</a>
      <span class="nav-sep" aria-hidden="true"></span>
      <a href="#/discover" data-nav="discover">Discover</a>
      <a href="#/planner" data-nav="planner">Daily queue</a>
      <span class="nav-sep" aria-hidden="true"></span>
      <a href="#/download" data-nav="download">Downloader</a>
      <a href="#/subtitles" data-nav="subtitles">Subtitles</a>
      <a href="#/convert" data-nav="convert">Converter</a>
      <a href="#/voice" data-nav="voice">AI voice</a>
      <span class="nav-sep" aria-hidden="true"></span>
      <a href="#/library" data-nav="library">Library</a>
      <a href="#/system" data-nav="system">System</a>
    </nav>
    <div class="activity" id="activity" aria-live="polite"></div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch light or dark mode" title="Light / dark">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <!-- ================================================================ home -->
  <template id="tpl-home">
    <section class="hero">
      <p class="eyebrow">Daily clipping workspace · runs on this PC</p>
      <h1>Long video in<br><span class="hi">Posts out</span></h1>
      <form class="quick" id="quick" autocomplete="off">
        <input type="url" name="url" placeholder="Paste a YouTube, TikTok, Instagram, X or Twitch link" aria-label="Video link" required>
        <div class="quick-actions">
          <button class="primary" type="submit" value="clips">Make clips</button>
          <button class="ghost" type="submit" value="download">Download</button>
          <button class="ghost" type="submit" value="subtitles">Subtitles</button>
        </div>
      </form>
    </section>

    <section class="workflow-strip" aria-label="Daily workflow">
      <a href="#/discover"><span>01 / Find</span><strong>Find a source</strong><small>Search YouTube by topic</small></a>
      <a href="#/clips"><span>02 / Edit</span><strong>Make your batch</strong><small>Recipes, captions and light hits</small></a>
      <a href="#/planner"><span>03 / Prepare</span><strong>Plan 2–4 posts</strong><small>Review, download, mark as posted</small></a>
    </section>

    <section class="tools">
      <a class="tool tool-clips" href="#/clips">
        <span class="tool-art" aria-hidden="true"><span class="phone mini" data-demo="clips"></span><span class="phone mini dim" data-demo="clips2"></span></span>
        <span class="tool-text"><strong>Clip maker</strong><span>Finds the best moments, cuts them on full sentences, crops to 9:16, adds captions, an AI voice hook and post copy.</span></span>
      </a>
      <a class="tool tool-download" href="#/download">
        <span class="tool-art" aria-hidden="true"><span class="art-file"><b>MP4</b><i>1080p</i></span><span class="art-file alt"><b>MP3</b><i>320k</i></span></span>
        <span class="tool-text"><strong>Downloader</strong><span>YouTube, TikTok, Instagram, X and 1000+ sites. Many links at once.</span></span>
      </a>
      <a class="tool tool-subtitles" href="#/subtitles">
        <span class="tool-art" aria-hidden="true"><span class="art-srt"><i>00:00:01,200 --&gt; 00:00:03,050</i><b>I had never seen that before.</b></span></span>
        <span class="tool-text"><strong>Subtitles</strong><span>SRT, VTT and text with word timing. Translate to English or burn styled captions in.</span></span>
      </a>
      <a class="tool tool-convert" href="#/convert">
        <span class="tool-art" aria-hidden="true"><span class="art-conv"><i class="wide"></i><em>→</em><i class="tall"></i></span></span>
        <span class="tool-text"><strong>Converter</strong><span>MP3, compress for Discord or WhatsApp, vertical 9:16, trim, GIF.</span></span>
      </a>
      <a class="tool tool-voice" href="#/voice">
        <span class="tool-art" aria-hidden="true"><span class="art-voice"><b>Wait till the end</b><span class="wave"><i></i><i></i><i></i><i></i><i></i></span></span></span>
        <span class="tool-text"><strong>AI voice</strong><span>Add a narrator hook to any video you already have: type the line or let it write one.</span></span>
      </a>
    </section>

    <section class="recent" id="recent" hidden>
      <div class="section-head"><h2>Recent</h2><a href="#/library">Open library</a></div>
      <div class="rows" id="recent-list"></div>
    </section>
  </template>

  <!-- ================================================================ shared source picker -->
  <template id="tpl-source">
    <div class="source">
      <div class="tabs" role="tablist" aria-label="Video source">
        <button type="button" role="tab" data-tab="url">Link</button>
        <button type="button" role="tab" data-tab="file">File</button>
        <button type="button" role="tab" data-tab="lib">Library</button>
      </div>
      <div data-pane="url">
        <input type="url" name="url" placeholder="https://www.youtube.com/watch?v=…" aria-label="Video link">
      </div>
      <label class="drop" data-pane="file">
        <input type="file" name="file">
        <span class="drop-text">Drop a file here, or <u>browse</u></span>
        <span class="drop-name"></span>
      </label>
      <div class="lib-pick" data-pane="lib"></div>
    </div>
  </template>

  <!-- ================================================================ clip maker -->
  <template id="tpl-clips">
    <form id="tool-form" class="tool-page" autocomplete="off" style="--k: var(--k-clips)">
      <div class="settings">
        <header class="page-head">
          <h1>Clip maker</h1>
          <p class="lede">One source. A batch of vertical clips. Pick a recipe, check the look, then make your clips.</p>
        </header>

        <section class="recipe-panel">
          <div class="section-head"><h2>Start with a recipe</h2><span class="muted">You can change every setting</span></div>
          <div class="recipe-grid" id="recipes"></div>
          <p class="hint-s" id="recipe-note" role="status"></p>
        </section>

        <section class="step">
          <h2 class="step-title"><span>01</span>Video</h2>
          <div id="source"></div>
        </section>

        <section class="step">
          <h2 class="step-title"><span>02</span>What's the video? <em class="step-note" id="mode-name"></em></h2>
          <div class="modes" id="clip-modes" role="radiogroup" aria-label="Video type"></div>
          <div class="field">
            <span class="label">Moments to find <small class="label-hint">tap to add or remove</small></span>
            <div class="cats" id="cats" role="group" aria-label="Moment types"></div>
          </div>
          <div class="field">
            <span class="label">Framing</span>
            <div class="seg" id="framings" role="radiogroup" aria-label="Framing"></div>
          </div>
        </section>

        <section class="step">
          <h2 class="step-title"><span>03</span>Clips</h2>
          <div class="row">
            <div class="field">
              <span class="label">How many</span>
              <div class="count-row">
                <div class="stepper" id="stepper">
                  <button type="button" data-step="-1" aria-label="Fewer clips">−</button>
                  <input type="number" name="clips" min="1" max="10" value="3" required aria-label="Number of clips">
                  <button type="button" data-step="1" aria-label="More clips">+</button>
                </div>
                <button type="button" class="auto-btn" id="auto" aria-pressed="false" title="Only the moments that are really strong, usually 2 to 5">Auto <small>best only</small></button>
              </div>
            </div>
            <div class="field grow">
              <span class="label">Length</span>
              <div class="seg" id="lengths" role="radiogroup" aria-label="Clip length"></div>
            </div>
          </div>
          <label class="switch"><input type="checkbox" name="thumbs" id="make-thumbs" checked><span><b>Make a thumbnail for each clip</b><small>The best frame with big words, an arrow and punchy colours, ready to upload as the cover</small></span></label>
          <div class="ai-row" id="ai-row">
            <label class="check"><input type="checkbox" id="thumbs-ai"><span><b>AI redraw the picture</b>
              <small id="ai-note">Runs on your graphics card: the frame is redrawn as a dramatic, hyper-detailed photo. About 15 s a clip.</small></span></label>
            <select id="thumbs-strength" aria-label="How much the AI changes the picture"></select>
          </div>
        </section>

        <section class="step">
          <h2 class="step-title"><span>04</span>Captions <em class="step-note" id="style-name"></em></h2>
          <div class="gallery" id="gallery" role="radiogroup" aria-label="Caption style"></div>
          <div class="field">
            <span class="label">Position</span>
            <div class="seg" id="positions" role="radiogroup" aria-label="Caption position"></div>
          </div>
          <label class="switch erase-switch"><input type="checkbox" name="erase_subs" id="erase-subs"><span><b>Remove the video's own subtitles</b><small>Finds subtitles burned into the picture and blurs them away, so only your captions show</small></span></label>
        </section>

        <section class="step">
          <h2 class="step-title"><span>05</span>AI voice hook <em class="step-note">optional</em></h2>
          <div id="voice"></div>
        </section>

        <section class="step">
          <h2 class="step-title"><span>06</span>Light hits <em class="step-note">optional</em></h2>
          <div id="effects" class="effect-grid" role="radiogroup" aria-label="Light effect"></div>
          <label class="intensity-field">Intensity <input name="effect_intensity" id="effect-intensity" type="range" min="0.1" max="1" step="0.1" value="0.5"><output id="intensity-value">50%</output></label>
          <p class="hint-s">Brief light hits at phrase changes, at least 2.5 seconds apart. Captions stay on top. Preview is illustrative; review the exported MP4.</p>
        </section>
      </div>

      <aside class="stage">
        <div class="stage-inner">
          <div class="stage-head"><span class="label">Style demo</span><span class="stage-note" id="stage-note"></span></div>
          <div class="phone big" id="demo-phone"></div>
          <div class="demo-tl" id="demo-tl" aria-hidden="true"></div>
        </div>
      </aside>

      <div class="actionbar">
        <p class="summary" id="summary"></p>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="upload" id="upload" hidden><div class="bar"><i></i></div><span>Uploading…</span></div>
        <button class="primary" type="submit">Make clips</button>
      </div>
    </form>
    <section class="recent" id="recent" hidden>
      <div class="section-head"><h2>Recent clip jobs</h2><a href="#/library?kind=clips">All</a></div>
      <div class="rows" id="recent-list"></div>
    </section>
  </template>

  <!-- ================================================================ downloader -->
  <template id="tpl-download">
    <form id="dl-form" class="tool-page" autocomplete="off" style="--k: var(--k-download)">
      <div class="settings">
        <header class="page-head">
          <h1>Downloader</h1>
          <p class="lede">Paste one link per line. Each becomes its own download, saved to your Library.</p>
          <p class="sites">YouTube · Shorts · TikTok · Instagram · X · Facebook · Reddit · Twitch · Vimeo · SoundCloud · 1000+ more</p>
        </header>
        <section class="step">
          <h2 class="step-title"><span>01</span>Links</h2>
          <textarea name="urls" rows="4" placeholder="https://www.tiktok.com/@user/video/…&#10;https://www.instagram.com/reel/…" required aria-label="Links"></textarea>
        </section>
        <section class="step">
          <h2 class="step-title"><span>02</span>Format</h2>
          <div class="cards2" id="dl-mode" role="radiogroup" aria-label="Format"></div>
          <div class="row" id="dl-video-opts">
            <label class="field">
              <span class="label">Quality</span>
              <select name="quality" id="dl-quality"></select>
            </label>
            <label class="check grow"><input type="checkbox" name="compatible" checked> <span>Most compatible<small>H.264, plays on every phone and editor</small></span></label>
          </div>
        </section>
      </div>
      <aside class="stage">
        <div class="stage-inner">
          <div class="stage-head"><span class="label">Link preview</span></div>
          <div class="preview" id="preview"></div>
        </div>
      </aside>
      <div class="actionbar">
        <p class="summary" id="summary"></p>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button class="primary" type="submit" id="dl-go">Download</button>
      </div>
    </form>
    <section class="recent">
      <div class="section-head"><h2>Downloads</h2><a href="#/library?kind=download">All</a></div>
      <div class="rows" id="dl-list"><p class="empty">Nothing downloaded yet.</p></div>
    </section>
  </template>

  <!-- ================================================================ subtitles -->
  <template id="tpl-subtitles">
    <form id="tool-form" class="tool-page" autocomplete="off" style="--k: var(--k-subtitles)">
      <div class="settings">
        <header class="page-head">
          <h1>Subtitles</h1>
          <p class="lede">Turns any video or audio into SRT, VTT and plain text, timed to the word.</p>
        </header>
        <section class="step">
          <h2 class="step-title"><span>01</span>Video or audio</h2>
          <div id="source"></div>
        </section>
        <section class="step">
          <h2 class="step-title"><span>02</span>Options</h2>
          <label class="switch"><input type="checkbox" name="translate" id="translate"><span><b>Translate to English</b><small>Any spoken language becomes English subtitles</small></span></label>
          <label class="switch"><input type="checkbox" name="burn" id="burn"><span><b>Burn captions into the video</b><small>Adds a captioned MP4 next to the subtitle files</small></span></label>
        </section>
        <section class="step" id="style-step" hidden>
          <h2 class="step-title"><span>03</span>Caption style <em class="step-note" id="style-name"></em></h2>
          <div class="gallery" id="gallery" role="radiogroup" aria-label="Caption style"></div>
          <div class="field">
            <span class="label">Position</span>
            <div class="seg" id="positions" role="radiogroup" aria-label="Caption position"></div>
          </div>
          <label class="switch erase-switch"><input type="checkbox" name="erase_subs" id="erase-subs"><span><b>Remove the video's own subtitles</b><small>Finds subtitles burned into the picture and blurs them away, so only your captions show</small></span></label>
        </section>
      </div>
      <aside class="stage">
        <div class="stage-inner">
          <div class="stage-head"><span class="label">What you get</span><span class="stage-note" id="stage-note"></span></div>
          <div id="sub-demo"></div>
        </div>
      </aside>
      <div class="actionbar">
        <p class="summary" id="summary"></p>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="upload" id="upload" hidden><div class="bar"><i></i></div><span>Uploading…</span></div>
        <button class="primary" type="submit">Make subtitles</button>
      </div>
    </form>
    <section class="recent" id="recent" hidden>
      <div class="section-head"><h2>Recent subtitles</h2><a href="#/library?kind=subtitles">All</a></div>
      <div class="rows" id="recent-list"></div>
    </section>
  </template>

  <!-- ================================================================ converter -->
  <template id="tpl-convert">
    <form id="tool-form" class="tool-page" autocomplete="off" style="--k: var(--k-convert)">
      <div class="settings">
        <header class="page-head">
          <h1>Converter</h1>
          <p class="lede">Quick fixes for a video you already have, or one from a link.</p>
        </header>
        <section class="step">
          <h2 class="step-title"><span>01</span>Video or audio</h2>
          <div id="source"></div>
        </section>
        <section class="step">
          <h2 class="step-title"><span>02</span>Make</h2>
          <div class="ops" id="ops" role="radiogroup" aria-label="Conversion"></div>
          <div class="op-opts" data-op="compress" hidden>
            <div class="field">
              <span class="label">Target size</span>
              <div class="presets-row" id="size-presets"></div>
              <div class="inline"><input type="number" name="target_mb" min="1" max="4000" step="0.5" value="10" aria-label="Target size in MB"> MB</div>
            </div>
          </div>
          <div class="op-opts" data-op="vertical" hidden>
            <div class="field"><span class="label">Fill the frame by</span><div class="seg" id="v-mode" role="radiogroup" aria-label="Vertical mode"></div></div>
          </div>
          <div class="op-opts" data-op="trim gif" hidden>
            <div class="row">
              <label class="field"><span class="label">Start</span><input type="text" name="start" value="0:00" inputmode="decimal" placeholder="m:ss"></label>
              <label class="field"><span class="label">End</span><input type="text" name="end" value="0:10" inputmode="decimal" placeholder="m:ss"></label>
              <label class="field" data-op="gif"><span class="label">GIF width</span>
                <select name="width"><option>320</option><option selected>480</option><option>640</option><option>720</option></select></label>
            </div>
            <p class="hint muted" data-op="gif">GIFs are limited to 30 seconds. Times as m:ss or seconds.</p>
          </div>
        </section>
      </div>
      <aside class="stage">
        <div class="stage-inner">
          <div class="stage-head"><span class="label">Before → after</span></div>
          <div class="op-demo" id="op-demo"></div>
          <div class="op-help" id="op-help"></div>
        </div>
      </aside>
      <div class="actionbar">
        <p class="summary" id="summary"></p>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="upload" id="upload" hidden><div class="bar"><i></i></div><span>Uploading…</span></div>
        <button class="primary" type="submit">Convert</button>
      </div>
    </form>
    <section class="recent" id="recent" hidden>
      <div class="section-head"><h2>Recent conversions</h2><a href="#/library?kind=convert">All</a></div>
      <div class="rows" id="recent-list"></div>
    </section>
  </template>

  <!-- ================================================================ AI voice -->
  <template id="tpl-voice">
    <form id="tool-form" class="tool-page" autocomplete="off" style="--k: var(--k-voice)">
      <div class="settings">
        <header class="page-head">
          <h1>AI voice</h1>
          <p class="lede">Adds a TikTok-style narrator hook to a video you already have: a clip you downloaded, one from the Library, or a file from your PC. Runs on your PC.</p>
        </header>

        <section class="step">
          <h2 class="step-title"><span>01</span>Video</h2>
          <div id="source"></div>
        </section>

        <section class="step">
          <h2 class="step-title"><span>02</span>Narrator line</h2>
          <label class="field">
            <textarea name="hook" id="hook" rows="2" maxlength="220" placeholder="Leave empty and it listens to the video and writes one for you"></textarea>
          </label>
          <div class="hook-ideas" id="hook-ideas"></div>
          <p class="hint-s" id="hook-note"></p>
        </section>

        <section class="step">
          <h2 class="step-title"><span>03</span>Voice and style</h2>
          <div id="voice"></div>
        </section>

        <section class="step">
          <h2 class="step-title"><span>04</span>Shape</h2>
          <div class="seg" id="shapes" role="radiogroup" aria-label="Shape of the video"></div>
        </section>
      </div>

      <aside class="stage">
        <div class="stage-inner">
          <div class="stage-head"><span class="label">Preview</span><span class="stage-note" id="stage-note"></span></div>
          <div class="phone big" id="demo-phone"></div>
        </div>
      </aside>

      <div class="actionbar">
        <p class="summary" id="summary"></p>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="upload" id="upload" hidden><div class="bar"><i></i></div><span>Uploading…</span></div>
        <button class="primary" type="submit">Add the voice</button>
      </div>
    </form>
    <section class="recent" id="recent" hidden>
      <div class="section-head"><h2>Recent voice jobs</h2><a href="#/library?kind=voice">All</a></div>
      <div class="rows" id="recent-list"></div>
    </section>
  </template>

  <!-- ================================================================ job -->
  <template id="tpl-job">
    <section class="job-top">
      <div class="job-title">
        <a class="crumb" id="crumb"></a>
        <h1 id="job-title"></h1>
        <div class="chips" id="job-chips"></div>
      </div>
      <div class="job-actions">
        <button class="ghost" id="job-retry" hidden>Retry from failed step</button>
        <a class="ghost" id="job-log" target="_blank">Log</a>
      </div>
    </section>

    <ol class="rail" id="stages"></ol>
    <div class="error-box" id="job-error" role="alert" hidden></div>

    <section class="timeline" id="timeline" hidden>
      <div class="tl-bar" id="tl-bar"></div>
      <div class="tl-scale"><span>0:00</span><span>Where each clip comes from</span><span id="tl-end"></span></div>
    </section>

    <section id="results" hidden>
      <div class="results-head">
        <h2 id="results-title">Results</h2>
        <a class="primary small" id="zip">Download all</a>
      </div>
      <div class="adjust" id="adjust" hidden>
        <form class="adjust-card" id="repick" hidden>
          <div class="adjust-head"><span class="label">Pick again</span>
            <span class="hint-s">Other moments, count or length. Reuses the transcript, so it is quick.</span></div>
          <div class="repick-grid">
            <select name="clip_mode" aria-label="Video type"></select>
            <select name="clips" aria-label="How many clips"></select>
            <select name="length" aria-label="Clip length"></select>
            <select name="framing" aria-label="Framing"></select>
          </div>
          <div class="cats small" id="repick-cats" role="group" aria-label="Moment types"></div>
          <button class="ghost" type="submit">Pick again</button>
        </form>
        <form class="adjust-card" id="restyle">
          <span class="label">Captions</span>
          <div class="restyle-grid">
            <span class="phone" id="restyle-demo" aria-hidden="true"></span>
            <div class="restyle-controls">
              <select name="preset" id="restyle-preset" aria-label="Caption style"></select>
              <select name="position" id="restyle-position" aria-label="Caption position"></select>
              <label class="check"><input type="checkbox" name="erase_subs" value="1" id="restyle-erase"> Remove the video's own subtitles</label>
              <button class="ghost" type="submit">Re-caption all</button>
            </div>
          </div>
        </form>
      </div>
      <div id="result-body"></div>
    </section>
  </template>

  <!-- ================================================================ library -->
  <template id="tpl-library">
    <section class="library">
      <header class="page-head lib-head">
        <h1>Library</h1>
        <span class="muted mono" id="lib-total"></span>
      </header>
      <div class="lib-tools">
        <div class="seg" id="lib-kinds" role="tablist" aria-label="Filter by tool"></div>
        <input type="search" id="lib-search" placeholder="Search titles" aria-label="Search titles">
      </div>
      <div class="rows" id="lib-list"></div>
    </section>
  </template>

  <!-- ================================================================ system -->
  <template id="tpl-system">
    <section class="system">
      <header class="page-head">
        <h1>System</h1>
        <p class="lede">What ClipForge runs on. Settings live in <code id="cfg-path">config.yaml</code>; restart the app after editing it.</p>
      </header>
      <div class="sys-grid" id="sys-grid"><p class="muted">Checking…</p></div>
    </section>
  </template>

  <script src="/static/monitor.js"></script>
  <script src="/static/app.js"></script>
<script>
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const root = document.documentElement;
    const current = root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    const next = current === "light" ? "dark" : "light";
    root.dataset.theme = next;
    try { localStorage.setItem("cf-theme", next); } catch {}
  });
</script>
</body>
</html>
